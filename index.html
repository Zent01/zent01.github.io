
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090707">

<title>PALERMO · Zent</title>

<meta name="description" content="PALERMO: One night in Palermo. The classic Mafia party game, with the narrator inside your phone.">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');

:root {
  --bg: #090707;
  --fg: #f4ead7;
  --muted: #9e9182;
  --gold: #c2a16b;
  --gold2: #ead09b;
  --red: #a91f2b;
  --line: rgba(194,161,107,.35);
}

* {
  box-sizing: border-box;
}

html, body {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 35px 18px;

  color: var(--fg);
  background:
    radial-gradient(ellipse at 50% 42%, rgba(91,17,20,.24), transparent 48%),
    radial-gradient(ellipse at 15% 15%, rgba(116,57,25,.12), transparent 40%),
    linear-gradient(145deg, #100b09, #080606 65%, #160909);

  font-family: 'Playfair Display', Georgia, serif;
}

/* Cinematic vignette */

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;

  background:
    radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.68) 100%),
    linear-gradient(90deg, rgba(0,0,0,.3), transparent 30%, transparent 70%, rgba(0,0,0,.3));
}

/* Film grain */

body::after {
  content: "";
  position: fixed;
  inset: -50%;
  z-index: 6;
  pointer-events: none;
  opacity: .11;

  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");

  animation: grain .3s steps(2) infinite;
}

@keyframes grain {
  0% { transform: translate(0,0); }
  25% { transform: translate(-2%,2%); }
  50% { transform: translate(2%,-1%); }
  75% { transform: translate(-1%,-2%); }
  100% { transform: translate(1%,1%); }
}

/* Rain */

.rain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: .24;

  background-image:
    repeating-linear-gradient(
      105deg,
      transparent 0px,
      transparent 48px,
      rgba(210,205,190,.13) 49px,
      transparent 50px
    );

  background-size: 120px 250px;
  animation: rainfall .65s linear infinite;
}

@keyframes rainfall {
  from { background-position: 0 0; }
  to { background-position: -40px 250px; }
}

/* Red ambient light */

.ambient {
  position: fixed;
  width: 550px;
  height: 550px;
  border-radius: 50%;
  background: rgba(125,14,22,.13);
  filter: blur(100px);
  pointer-events: none;
  animation: pulse 7s ease-in-out infinite alternate;
}

@keyframes pulse {
  from { opacity: .35; transform: scale(.85); }
  to { opacity: .8; transform: scale(1.15); }
}

/* Main */

main {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 620px;
  padding: 65px 25px 45px;
  text-align: center;

  animation: entrance 1.5s ease both;
}

@keyframes entrance {
  from {
    opacity: 0;
    transform: translateY(25px);
    filter: blur(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}

.pre {
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: .78rem;
  letter-spacing: .48em;
  text-transform: uppercase;
  margin: 0 0 17px;
  animation: fade 2s ease both;
}

h1 {
  position: relative;
  font-family: 'Cinzel', serif;
  font-size: clamp(3.2rem, 13vw, 6.2rem);
  font-weight: 500;
  line-height: 1;
  letter-spacing: .13em;
  margin: 0;

  color: var(--gold2);

  background: linear-gradient(
    110deg,
    #8b683d,
    #f5e1b5,
    #b38a4c,
    #f7e7c6,
    #947044
  );

  background-size: 250% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;

  animation: goldshine 8s linear infinite;
}

@keyframes goldshine {
  to { background-position: 250% center; }
}

.subtitle {
  color: #c5b6a0;
  font-size: clamp(1rem, 3vw, 1.2rem);
  letter-spacing: .025em;
  margin-top: 23px;
  line-height: 1.8;
}

.en {
  color: var(--muted);
  font-family: Georgia, serif;
  font-style: italic;
  font-size: .94rem;
  margin-top: 7px;
}

.rule {
  width: 160px;
  height: 1px;
  margin: 28px auto;
  position: relative;

  background: linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
}

.rule::after {
  content: "◆";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  padding: 0 12px;
  color: var(--red);
  background: #100908;
  font-size: 11px;
  text-shadow: 0 0 15px var(--red);
}

/* Atmospheric label */

.stamp {
  display: inline-block;
  color: #a88c64;
  border: 1px solid rgba(169,31,43,.55);
  padding: 7px 18px;
  margin-top: 28px;

  font-family: 'Cinzel', serif;
  font-size: .68rem;
  letter-spacing: .28em;
  text-transform: uppercase;

  box-shadow: 0 0 25px rgba(169,31,43,.12);
}

/* Navigation */

nav {
  margin-top: 37px;
}

nav a {
  display: inline-block;
  color: var(--fg);
  text-decoration: none;

  border: 1px solid var(--line);
  padding: 12px 23px;

  font-family: 'Cinzel', serif;
  font-size: .77rem;
  letter-spacing: .1em;

  transition: .35s ease;
  background: rgba(255,255,255,.015);
}

nav a:hover {
  color: var(--gold2);
  border-color: var(--gold);
  background: rgba(194,161,107,.08);
  box-shadow: 0 0 30px rgba(194,161,107,.12);
  transform: translateY(-3px);
}

/* Contact */

.contact {
  margin-top: 45px;
}

.contact .lbl {
  color: var(--muted);
  font-family: 'Cinzel', serif;
  font-size: .68rem;
  letter-spacing: .3em;
  margin-bottom: 14px;
}

.mail {
  display: inline-flex;
  align-items: center;
  gap: 10px;

  border: 1px solid var(--line);
  padding: 6px 7px 6px 17px;
  max-width: 100%;

  background: rgba(0,0,0,.28);
  transition: .3s;
}

.mail:hover {
  border-color: var(--gold);
  box-shadow: 0 0 25px rgba(194,161,107,.08);
}

.mail a {
  color: var(--gold2);
  text-decoration: none;
  font-size: .9rem;
  overflow-wrap: anywhere;
}

.mail button {
  color: var(--fg);
  background: #261313;
  border: 1px solid rgba(169,31,43,.5);
  padding: 7px 13px;
  font: inherit;
  font-size: .76rem;
  cursor: pointer;
  transition: .3s;
}

.mail button:hover {
  background: #63151d;
  border-color: var(--red);
}

.mail button.done {
  background: #741b24;
  border-color: var(--red);
}

/* Footer */

footer {
  margin-top: 55px;
  color: #74685c;
  font-family: 'Cinzel', serif;
  font-size: .68rem;
  letter-spacing: .2em;
}

/* Language switch */

.lang {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 20;
  display: flex;
  border: 1px solid var(--line);
  background: rgba(0,0,0,.35);
}

.lang button {
  font-family: 'Cinzel', serif;
  font-size: .7rem;
  letter-spacing: .14em;
  color: var(--muted);
  background: transparent;
  border: 0;
  padding: 8px 12px;
  cursor: pointer;
  transition: .3s;
}

.lang button + button {
  border-left: 1px solid var(--line);
}

.lang button:hover {
  color: var(--gold2);
}

.lang button[aria-pressed="true"] {
  color: var(--fg);
  background: rgba(169,31,43,.35);
}

/* Mobile */

@media(max-width: 480px) {
  main {
    padding: 40px 10px;
  }

  .pre {
    letter-spacing: .32em;
  }

  .mail {
    flex-wrap: wrap;
    justify-content: center;
  }
}

/* Accessibility */

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="rain"></div>
<div class="ambient"></div>

<div class="lang" role="group" aria-label="Language">
  <button type="button" data-lang="el" aria-pressed="false">Ελληνικά</button>
  <button type="button" data-lang="en" aria-pressed="true">English</button>
</div>

<main>

  <p class="pre" data-t="pre">One night in</p>

  <h1>PALERMO</h1>

  <div class="rule"></div>

  <p class="subtitle" data-t="subtitle">
    Every city hides its secrets.<br>
    Every night has its guilty ones.
  </p>

  <p class="en" data-t="tagline">
    The classic Mafia party game, with the narrator inside your phone.
  </p>

  <div class="stamp">
    Trust no one · Speak carefully
  </div>

  <nav>
    <a href="privacy.html#en" id="privacy" data-t="privacy">
      Privacy Policy
    </a>
  </nav>

  <div class="contact">
    <div class="lbl" data-t="contact">Contact</div>

    <div class="mail">
      <a href="mailto:bonzaras10@gmail.com">
        bonzaras10@gmail.com
      </a>

      <button type="button" id="copy" data-t="copy">
        Copy
      </button>
    </div>
  </div>

  <footer>
    © 2026 ZENT · AN OFFER YOU CAN'T REFUSE
  </footer>

</main>

<script>
(function () {
  var T = {
    en: {
      pre: 'One night in',
      subtitle: 'Every city hides its secrets.<br>Every night has its guilty ones.',
      tagline: 'The classic Mafia party game, with the narrator inside your phone.',
      privacy: 'Privacy Policy',
      contact: 'Contact',
      copy: 'Copy',
      copied: 'Copied ✓',
      description: 'PALERMO: One night in Palermo. The classic Mafia party game, with the narrator inside your phone.'
    },
    el: {
      pre: 'Μια νύχτα στο',
      subtitle: 'Κάθε πόλη κρύβει τα μυστικά της.<br>Κάθε νύχτα έχει τους ενόχους της.',
      tagline: 'Το κλασικό παιχνίδι Μαφίας για παρέες, με τον αφηγητή μέσα στο κινητό.',
      privacy: 'Πολιτική απορρήτου',
      contact: 'Επικοινωνία',
      copy: 'Αντιγραφή',
      copied: 'Αντιγράφηκε ✓',
      description: 'PALERMO: Μια νύχτα στο Παλέρμο. Το κλασικό παιχνίδι Μαφίας για παρέες, με τον αφηγητή μέσα στο κινητό.'
    }
  };
  var KEY = 'palermo-lang';
  var lang = 'en';
  try {
    var saved = localStorage.getItem(KEY);
    if (saved === 'el' || saved === 'en') lang = saved;
  } catch (e) {}

  function apply(l) {
    lang = l;
    var d = T[l];
    document.documentElement.lang = l;
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
      var k = el.getAttribute('data-t');
      if (k === 'subtitle') el.innerHTML = d[k]; else el.textContent = d[k];
    });
    document.getElementById('privacy').setAttribute('href', 'privacy.html#' + l);
    var meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute('content', d.description);
    Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === l ? 'true' : 'false');
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function (b) {
    b.addEventListener('click', function () {
      var l = b.getAttribute('data-lang');
      try { localStorage.setItem(KEY, l); } catch (e) {}
      apply(l);
    });
  });
  apply(lang);

  var btn = document.getElementById('copy');
  var mail = 'bonzaras10@gmail.com';

  function ok() {
    btn.textContent = T[lang].copied;
    btn.classList.add('done');

    setTimeout(function () {
      btn.textContent = T[lang].copy;
      btn.classList.remove('done');
    }, 1800);
  }

  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = mail;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';

    document.body.appendChild(ta);
    ta.select();

    try {
      document.execCommand('copy');
      ok();
    } catch (e) {}

    document.body.removeChild(ta);
  }

  btn.addEventListener('click', function () {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(mail).then(ok, fallback);
    } else {
      fallback();
    }
  });
})();
</script>

</body>
</html>
